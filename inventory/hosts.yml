all:
  children:
    k8s_nodes:
      children:
        k8s_control_plane:
          hosts:
            rp5-0:
              ansible_host: 192.168.1.166
            rp5-1:
              ansible_host: 192.168.1.151
            rp5-2:
              ansible_host: 192.168.1.249
        k8s_workers:
          hosts:
            rp5-3:
              ansible_host: 192.168.1.171
            hme-srv-01:
              ansible_host: 192.168.1.231
            hme-srv-02:
              ansible_host: 192.168.1.154
            hme-srv-03:
              ansible_host: 192.168.1.174
        # Cross-cutting groups (a host may belong to several). group_vars for
        # rp5_nodes (longhorn disk reservation) still apply via rp5_nodes.
        rp5_nodes:
          hosts:
            rp5-0:
              ansible_host: 192.168.1.166
            rp5-1:
              ansible_host: 192.168.1.151
            rp5-2:
              ansible_host: 192.168.1.249
            rp5-3:
              ansible_host: 192.168.1.171
        home_server:
          hosts:
            hme-srv-01:
              ansible_host: 192.168.1.231
            hme-srv-02:
              ansible_host: 192.168.1.154
            hme-srv-03:
              ansible_host: 192.168.1.174
    # The two freshly-joined R720 nodes. group_vars/new_workers.yml gives them
    # password auth (no SSH key deployed yet); the existing nodes keep key auth
    # + passwordless sudo from group_vars/all.yml.
    new_workers:
      hosts:
        hme-srv-02:
          ansible_host: 192.168.1.154
        hme-srv-03:
          ansible_host: 192.168.1.174
    # The two Dell PowerEdge R720 worker nodes — iDRAC7 power-saving targets
    # (WS7). group_vars/r720_nodes.yml holds the iDRAC creds; each host's
    # idrac_ip is in host_vars/hme-srv-0{2,3}.yml. roles/r720_powersave.
    r720_nodes:
      hosts:
        hme-srv-02:
          ansible_host: 192.168.1.154
        hme-srv-03:
          ansible_host: 192.168.1.174
    # k8s_control_plane_new (control-plane HA work) REMOVED 2026-08-12: both
    # rp5-1 (2026-08-11) and rp5-2 (2026-08-12) are now live, verified
    # control-plane members - moved into k8s_control_plane above per this
    # group's own original instructions. 3-node control plane, etcd 3/3,
    # real HA (tolerates one node loss) achieved.