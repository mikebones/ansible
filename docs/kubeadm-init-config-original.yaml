#   token changed to zjp1ro.pdzh85s9f41kzijm
#   allocate-node-cidrs: "true" (quoted)
#   adds: controllerManager.extraArgs.feature-gates: NFTablesProxyMode=true
#   adds: kubeProxy mode: "nftables" + featureGates.NFTablesProxyMode: true
#   KubeletConfiguration: drops resolvConf line, moves podCIDR below podCIDRs
# ---------------------------------------------------------------------------
