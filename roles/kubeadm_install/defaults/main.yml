---
# Role: kubeadm_install
# Defaults for installing kubeadm on a fresh Ubuntu node and joining it as a
# worker. The authoritative values live in group_vars/new_workers.yml; these are
# fallbacks so the role is usable standalone.

k8s_join_minor: "1.29"                 # pkgs.k8s.io apt repo channel (v1.29)
k8s_join_patch: "1.29.7-1.1"           # kubelet/kubeadm/kubectl full apt version
k8s_pause_image: "registry.k8s.io/pause:3.9"  # matches cluster imageRepository

# Set by play 1 of playbooks/join_nodes.yml (kubeadm join ... --token ... --hash).
kubeadm_join_cmd: ""