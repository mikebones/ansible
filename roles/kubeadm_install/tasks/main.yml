---
# Role: kubeadm_install
# Installs containerd + kubelet/kubeadm/kubectl (pinned to the cluster version) on
# a fresh Ubuntu node and joins it as a worker. Mirrors the setup the existing
# nodes already have (containerd + SystemdCgroup, Flannel CNI via DaemonSet).
#
# The kubeadm join command (token + CA-cert hash) is generated by play 1 of
# playbooks/join_nodes.yml with kubectl on the control machine and read here
# from hostvars['localhost']['kubeadm_join_cmd'].
#
# 2026-08-11: OS-prep steps (containerd, kernel modules, sysctls, swap-disable,
# pinned kubelet/kubeadm/kubectl) moved to roles/k8s_node_prereqs (control-plane
# HA work needed the same steps for a CP join, without a third copy). Behavior
# here is unchanged — this just delegates first.

- name: Run shared node OS-prep (containerd, sysctls, pinned k8s packages)
  import_role:
    name: k8s_node_prereqs

- name: Check if node already joined the cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join the cluster as a worker
  command: "{{ hostvars['localhost']['kubeadm_join_cmd'] }}"
  when: not kubelet_conf.stat.exists
  register: join_result
  changed_when: true

- name: Show join result
  debug:
    var: join_result.stdout_lines
  when: join_result is changed