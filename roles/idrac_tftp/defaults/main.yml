---
# Role: idrac_tftp — stand up a temporary TFTP server on hme-srv-01 to stage
# iDRAC7 firmware for the two R720 iDRACs (192.168.1.252 + .253).
#
# Why TFTP: on iDRAC fw 1.23.23 the only reliable remote firmware method is
# `racadm fwupdate -g -u -a <tftp-ip> -d <path>` (TFTP). `racadm remoteimage`
# (HTTP) is a confirmed dead-end on this fw (see ~/git/idrac/NOTES.md). The
# iDRACs pull the firmware over UDP/69, so the TFTP server must be on the same
# LAN — hme-srv-01 (192.168.1.231) is the always-on ansible-managed box.
#
# TEMPORARY: tftpd-hpa binds :69 LAN-wide (unauthenticated). After the fw
# upgrade completes, re-run the playbook with -e idrac_tftp_enabled=false to
# stop + disable the daemon. The fw binaries themselves are gitignored
# (Dell-licensed, user-supplied under files/idrac-fw/).

# TFTP root the iDRACs pull from.
idrac_tftp_root: /srv/tftp/idrac-fw

# Where the user stages the extracted Dell firmimg.d7 files (renamed per
# version). Relative to the playbook dir.
idrac_fw_staging: "{{ playbook_dir }}/../files/idrac-fw"

# The staged firmware images for the THREE-hop Dell upgrade path on a 12th-gen
# R720 (1.23.23 -> 1.66.65 -> 2.10.10.10 -> 2.65.65.65; 2.30.30.30 is NOT a
# required step). Dell ships every version as firmimg.d7 — to avoid collisions
# in one flat staging dir the user renames each to firmimg-<ver>.d7 under
# files/idrac-fw/. This role then deploys each to <TFTP-root>/<ver>/firmimg.d7.
#
# WHY subdirs: iDRAC7 `racadm fwupdate -g -u -a <ip> -d <X>` treats <X> as a
# DIRECTORY and always TFTP-GETs `<X>/firmimg.d7` (verified on fw 1.23.23 with
# tcpdump). Giving `-d` the bare filename makes the iDRAC request
# `firmimg-<ver>.d7/firmimg.d7` -> TFTP "not found" -> the misleading racadm
# error "Remote host is not reachable or connection is interrupted" and NOTHING
# is pulled. So we stage <root>/<version>/firmimg.d7 and flash with
# `racadm fwupdate -g -u -a <tftp-ip> -d <version>`. The role fails if any
# source file is missing from idrac_fw_staging.
idrac_fw_images:
  - { version: "1.66.65",    src: "firmimg-1.66.65.d7" }
  - { version: "2.10.10.10", src: "firmimg-2.10.10.10.d7" }
  - { version: "2.65.65.65", src: "firmimg-2.65.65.65.d7" }

# true = install + start tftpd-hpa. false = teardown (stop + disable). Set
# false and re-run after the upgrade to remove the LAN-wide TFTP daemon.
idrac_tftp_enabled: true

# tftpd-hpa listen address (:69 = all interfaces, LAN-reachable).
idrac_tftp_address: ":69"
idrac_tftp_options: "--secure --ipv4"