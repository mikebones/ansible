---
# Role: kubeadm_control_plane_join
# Joins a node to the control plane / etcd, generated by play 1 of
# playbooks/join_control_plane.yml on rp5-0 (see defaults/main.yml).
#
# CRITICAL — always run this via `serial: 1` (playbooks/join_control_plane.yml
# does). Joining two control-plane nodes to etcd at once risks the cluster
# never reaching quorum if either join has a problem mid-flight.
#
# CRITICAL CORRECTION (2026-08-11, found while writing this role): rp5-1 and
# rp5-2 are NOT fresh nodes — they've been joined WORKERS for 2+ years.
# kubeadm has no "promote an existing member to control-plane" operation:
# `kubeadm join --control-plane` refuses outright on any node that already
# has /etc/kubernetes/kubelet.conf ("a Kubernetes installation already
# exists"). The only supported path for these two specific nodes is: drain ->
# delete the Node object -> `kubeadm reset` locally -> rejoin fresh with
# --control-plane. That's real, visible disruption the original plan text
# didn't spell out (it read like a pure addition) — the block below handles
# it, gated so it only fires for a node that's a worker-only member today;
# a genuinely fresh node just skips straight to the join.

- name: Check whether this node is already a control-plane member
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Check whether this node is currently joined as a worker only
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: BLOCK — demote this node from worker to bare metal before a CP rejoin
  when:
    - kubelet_conf.stat.exists
    - not admin_conf.stat.exists
  block:
    # Longhorn replicas physically on this node rebuild on other nodes during
    # the drain (2-replica minimum already enforced cluster-wide — see the
    # 2026-08-09 stuck-replica remediation work) — expect replica-rebuild I/O
    # on the remaining nodes, not data loss. PDBs with allowedDisruptions=0
    # (Longhorn instance-manager, loki-write, vault, istiod) can make this
    # drain hang if any of those pods happen to be on this node; investigate
    # rather than forcing through if it does.
    - name: Drain {{ inventory_hostname }} before removing it from the cluster
      delegate_to: rp5-0
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --timeout=300s
      changed_when: true

    - name: Delete the {{ inventory_hostname }} Node object
      delegate_to: rp5-0
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      command: "kubectl delete node {{ inventory_hostname }}"
      changed_when: true

    - name: kubeadm reset this node
      command: kubeadm reset -f
      changed_when: true

    - name: Confirm kubelet.conf is actually gone after reset
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf_post_reset
      failed_when: kubelet_conf_post_reset.stat.exists

- name: Run shared node OS-prep (containerd, sysctls, pinned k8s packages)
  import_role:
    name: k8s_node_prereqs

# 2026-08-12: kubeadm regenerates every static-pod manifest (kube-apiserver,
# etcd, scheduler, controller-manager) from scratch on join/upgrade - any
# hand-edit made directly to a live /etc/kubernetes/manifests/*.yaml (e.g. an
# emergency SSH fix) is silently lost the next time this role or
# kubeadm_upgrade runs, since neither previously passed --patches. Populated
# here so it's already in place before the join command below generates the
# manifests - see roles/kubeadm_patches for the shared patch files.
- name: Sync kubeadm static-pod patches
  import_role:
    name: kubeadm_patches

- name: Check if this node has already joined as control-plane (post-prep)
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_now

- name: Join the control plane
  command: "{{ hostvars['rp5-0']['kubeadm_cp_join_cmd'] }} --patches=/etc/kubernetes/patches"
  when: not kubelet_conf_now.stat.exists
  register: cp_join_result
  changed_when: true

- name: Show control-plane join result
  debug:
    var: cp_join_result.stdout_lines
  when: cp_join_result is changed

- name: Deploy kube-vip on this control-plane node
  import_role:
    name: kube_vip

# 2026-08-12: this role previously tainted every new control-plane node
# NoSchedule. Removed - this is a 5-node Pi cluster with no capacity to
# reserve control-plane nodes for control-plane-only duty; general
# workloads (transmission, vault-0, pihole, etc.) genuinely need to run on
# rp5-1/rp5-2/rp5-3 alongside the control-plane role. Confirmed live
# 2026-08-12 that no node in the cluster actually carries this taint today
# - leaving the task in place would have silently reintroduced it (and
# broken scheduling for those workloads) the next time a control-plane node
# was reset and rejoined.
- name: Wait for this node to show Ready with the control-plane role
  delegate_to: rp5-0
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  command: "kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=180s"
  changed_when: false
